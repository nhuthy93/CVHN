<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pipeline Manager</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar: Left Column -->
        <aside class="sidebar">
            <div class="calendar-card">
                <div class="calendar-header">
                    <button id="prev-month"><i class="fas fa-chevron-left"></i></button>
                    <div class="month-year-selector">
                        <select id="month-select"></select>
                        <select id="year-select"></select>
                    </div>
                    <button id="next-month"><i class="fas fa-chevron-right"></i></button>
                </div>
                <div class="calendar-grid-header">
                    <span>CN</span><span>T2</span><span>T3</span><span>T4</span><span>T5</span><span>T6</span><span>T7</span>
                </div>
                <div class="calendar-grid" id="calendar-days">
                    <!-- Days will be generated by JS -->
                </div>
            </div>

            <div class="tabs-container vertical-tabs">
                <button class="tab-btn active" data-tab="today">
                    <div class="tab-label">
                        <i class="fas fa-calendar-day"></i> Hôm nay xử lý
                    </div>
                    <span class="badge" id="badge-today">0</span>
                </button>
                <button class="tab-btn" data-tab="late">
                    <div class="tab-label">
                        <i class="fas fa-exclamation-triangle"></i> Đơn trễ pipeline
                    </div>
                    <span class="badge" id="badge-late">0</span>
                </button>
            </div>
            
            <div class="tabs-container vertical-tabs" style="margin-top: 20px; flex-grow: 0;">
                <button class="tab-btn" data-tab="off_system">
                    <div class="tab-label">
                        <i class="fas fa-briefcase"></i> Công việc ngoài hệ thống
                    </div>
                    <span class="badge" id="badge-offsystem">0</span>
                </button>
            </div>
        </aside>

        <!-- Main Content: Right Column -->
        <main class="main-content">
            <!-- Header for current view -->
            <header class="main-header">
                <h1 id="view-title">Đơn hàng chưa set pipeline</h1>
                <div class="header-actions">
                     <div class="search-box">
                        <i class="fas fa-search"></i>
                        <input type="text" placeholder="Tìm kiếm đơn hàng...">
                     </div>
                </div>
            </header>

            <!-- Content Area -->
            <div class="content-area">
                <!-- Default View -->
                <div id="default-view">
                    <!-- Data Table -->
                    <div class="table-container">
                        <table id="orders-table">
                            <thead>
                                <tr>
                                    <th>Mã đơn hàng</th>
                                    <th>Tên khách hàng</th>
                                    <th>Ngày set pipeline</th>
                                    <th>Nội dung pipeline</th>
                                    <th>Thao tác</th>
                                </tr>
                            </thead>
                            <tbody id="orders-body">
                                <!-- Rows generated by JS -->
                            </tbody>
                        </table>
                        
                        <div id="empty-state" class="empty-state hidden">
                            <i class="fas fa-folder-open"></i>
                            <p>Không có dữ liệu</p>
                        </div>
                    </div>
                </div>

                <!-- Off-system view -->
                <div id="off-system-view" class="hidden">
                    <div class="horizontal-tabs">
                        <button class="sub-tab-btn active" data-subtab="add_task"><i class="fas fa-plus"></i> Thêm công việc</button>
                        <button class="sub-tab-btn" data-subtab="list_task">Danh sách</button>
                    </div>
                    
                    <div id="sub-view-add" class="sub-view">
                        <form id="off-system-form" class="custom-form">
                             <div class="form-group">
                                 <label>Nội dung (gồm ID và công việc cần xử lý)</label>
                                 <input type="text" id="os-content" required>
                             </div>
                             <div class="form-group">
                                 <label>Ngày hẹn pipeline</label>
                                 <input type="date" id="os-date" required>
                             </div>
                             <button type="submit" class="btn-submit">Lưu công việc</button>
                        </form>
                    </div>

                    <div id="sub-view-list" class="sub-view hidden">
                        <div class="table-container">
                            <table id="os-table">
                                <thead>
                                    <tr>
                                        <th>Ngày hẹn pipeline</th>
                                        <th>Nội dung</th>
                                        <th>Thao tác</th>
                                    </tr>
                                </thead>
                                <tbody id="os-body">
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal for setting pipeline -->
    <div id="pipeline-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Set Pipeline</h2>
                <button class="close-modal"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <form id="pipeline-form">
                    <input type="hidden" id="modal-order-id">
                    <div class="form-group">
                        <label>Ngày set pipeline</label>
                        <input type="date" id="modal-date" required>
                    </div>
                    <div class="form-group">
                        <label>Nội dung pipeline</label>
                        <input type="text" id="modal-content" placeholder="Nhập nội dung..." required>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn-cancel close-modal">Hủy</button>
                        <button type="submit" class="btn-submit">Lưu</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Overlay for modal -->
    <div id="modal-overlay" class="modal-overlay hidden"></div>

    <!-- Modal for editing off-system task -->
    <div id="os-edit-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Sửa công việc ngoài hệ thống</h2>
                <button class="close-os-modal"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <form id="os-edit-form">
                    <input type="hidden" id="os-edit-id">
                    <div class="form-group">
                        <label>Ngày hẹn pipeline</label>
                        <input type="date" id="os-edit-date" required>
                    </div>
                    <div class="form-group">
                        <label>Nội dung</label>
                        <input type="text" id="os-edit-content" required>
                    </div>
                    <div class="form-actions">
                        <button type="button" class="btn-cancel close-os-modal">Hủy</button>
                        <button type="submit" class="btn-submit">Lưu</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
